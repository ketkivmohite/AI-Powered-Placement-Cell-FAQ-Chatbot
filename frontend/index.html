<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Cell FAQ Chatbot</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">
            <h1>Placement Cell FAQ Chatbot</h1>
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-box" id="chat-box">

            <div class="bot-message">
                Hello! Ask me anything about placements.
            </div>

        </div>

        <!-- Input Area -->
        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Type your question..."
            >

            <button id="send-btn">
                Send
            </button>

        </div>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
